server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    # Le service worker et le manifest doivent toujours être revalidés.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(png|svg)$ { add_header Cache-Control "public, max-age=604800"; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
